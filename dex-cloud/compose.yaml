name: dex-cloud

services:
  cloud:
    build: .
    image: dex-cloud:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8791:8791"
    env_file: .env
    volumes:
      - ./data:/data
    user: "1000:1000"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 1g
    logging:
      driver: journald
      options: { tag: dex-cloud }
