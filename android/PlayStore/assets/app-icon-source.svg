<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Luna Bot</title>
  <desc id="desc">The app's bot face: a white disc with two tilted pill eyes, bleeding off the right and bottom of a black tile.</desc>
  <defs>
    <radialGradient id="face" cx="0.31" cy="0.16" r="0.78">
      <stop offset="0" stop-color="#FCFAF6"/>
      <stop offset="0.55" stop-color="#F7F3ED"/>
      <stop offset="1" stop-color="#D6D2CA"/>
    </radialGradient>
    <clipPath id="tile"><rect width="1024" height="1024" rx="224"/></clipPath>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="#000"/>
  <g clip-path="url(#tile)">
    <circle cx="650" cy="650" r="560" fill="url(#face)"/>
    <g transform="rotate(-16.7 469.023 628.669)">
      <rect x="399.023" y="491.469" width="140" height="274.4" rx="70" fill="#1C1C1E"/>
    </g>
    <g transform="rotate(-16.7 830.977 503.331)">
      <rect x="760.977" y="366.131" width="140" height="274.4" rx="70" fill="#1C1C1E"/>
    </g>
  </g>
</svg>
