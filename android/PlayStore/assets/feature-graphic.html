<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1024px; height:500px; overflow:hidden; font-family:Inter,system-ui,sans-serif;
         background:#0A0C0B; color:#F5F7F6; }
  .wrap { position:relative; width:1024px; height:500px; display:flex; align-items:center;
           gap:56px; padding:0 72px; }
  .glow { position:absolute; width:620px; height:620px; right:-160px; top:-160px; border-radius:50%;
           background:radial-gradient(circle, rgba(247,243,237,0.16) 0%, rgba(247,243,237,0) 68%); }
  .mark { position:relative; flex:0 0 auto; display:grid; place-items:center;
           width:230px; height:230px;
           box-shadow:0 30px 70px rgba(0,0,0,0.55); }
  .mark svg { width:230px; height:230px; }
  .copy { position:relative; }
  h1 { font-size:66px; font-weight:700; letter-spacing:-0.035em; line-height:1; }
  p { margin-top:22px; font-size:29px; font-weight:400; line-height:1.35; color:#A8B3AE; max-width:520px; letter-spacing:-0.01em; }
  .rule { margin-top:30px; width:88px; height:5px; border-radius:99px; background:#F7F3ED; }
</style></head><body>
<div class="wrap"><div class="glow"></div>
  <div class="mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="230" height="230"><title>Luna Bot</title><defs><radialGradient id="face" cx="0.31" cy="0.16" r="0.78"><stop offset="0" stop-color="#FCFAF6"/><stop offset="0.55" stop-color="#F7F3ED"/><stop offset="1" stop-color="#D6D2CA"/></radialGradient><clipPath id="tile"><rect width="1024" height="1024" rx="224"/></clipPath></defs><rect width="1024" height="1024" rx="224" fill="#000"/><g clip-path="url(#tile)"><circle cx="650" cy="650" r="560" fill="url(#face)"/><g transform="rotate(-16.7 469.023 628.669)"><rect x="399.023" y="491.469" width="140" height="274.4" rx="70" fill="#1C1C1E"/></g><g transform="rotate(-16.7 830.977 503.331)"><rect x="760.977" y="366.131" width="140" height="274.4" rx="70" fill="#1C1C1E"/></g></g></svg></div>
  <div class="copy">
    <h1>Luna Bot</h1>
    <p>Your own AI bots, running on your own computer — answered from your phone.</p>
    <div class="rule"></div>
  </div>
</div></body></html>
