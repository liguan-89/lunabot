name: ${COMPOSE_PROJECT_NAME:-openmausbot-podman}
services:
  omb:
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile
      args:
        ENGINES: ${ENGINES:-}
    image: localhost/openmausbot-podman:${LUNABOT_IMAGE_TAG:-local}
    # Collects exited browser processes; Chrome's shared memory as on the
    # desktop containers (docs/browser-packaging.md, "Process hygiene").
    init: true
    shm_size: 512m
    userns_mode: keep-id:uid=1001,gid=1001
    user: "1001:1001"
    restart: unless-stopped
    # On Windows this is the Linux Podman machine. The app must reach the
    # dynamically allocated, loopback-only desktop ports on that same host.
    network_mode: host
    volumes:
      - ${LUNABOT_DATA_ROOT:?Run setup.sh first}:${LUNABOT_DATA_ROOT}
      - ${PODMAN_SOCKET:?Run setup.sh first}:/run/omb-podman.sock
    environment:
      HOME: ${LUNABOT_DATA_ROOT}
      LUNABOT_DATA_DIR: ${LUNABOT_DATA_ROOT}/.lunabot
      LUNABOT_STATIC_DIR: /app/dist
      CONTAINER_HOST: unix:///run/omb-podman.sock
      LUNABOT_PORT: ${LUNABOT_PORT:-8799}
      LUNABOT_WEBHOOK_PORT: ${LUNABOT_WEBHOOK_PORT:-8800}
      LUNABOT_PUBLIC_URL: ${LUNABOT_PUBLIC_URL:-http://localhost:8080}
      LUNABOT_WEBHOOK_PUBLIC_URL: ${LUNABOT_PUBLIC_URL:-http://localhost:8080}
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:$$LUNABOT_PORT/api/health | grep -qE "dexbot|openmausbot"']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: docker.io/library/caddy:2.11.4
    restart: unless-stopped
    network_mode: host
    depends_on:
      omb:
        condition: service_healthy
    environment:
      LUNABOT_HTTP_PORT: ${LUNABOT_HTTP_PORT:-8080}
      LUNABOT_PORT: ${LUNABOT_PORT:-8799}
      LUNABOT_WEBHOOK_PORT: ${LUNABOT_WEBHOOK_PORT:-8800}
      LUNABOT_HTTPS_HOST: ${LUNABOT_HTTPS_HOST:-https-disabled.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
