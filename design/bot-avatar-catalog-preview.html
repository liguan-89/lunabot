<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luna Bot 全端共用 Bot 资产库 · 18 套风格预览</title>
  <style>
    :root {
      --bg: #f6f5f2;
      --surface: #ffffff;
      --surface-soft: #efede8;
      --ink: #1a1b1f;
      --ink-muted: #6c6f78;
      --border: rgba(24, 24, 28, 0.08);
      --accent: #3b82f6;
      --new-badge: #10b981;
    }
    body.dark {
      --bg: #111216;
      --surface: #1a1c22;
      --surface-soft: #23262f;
      --ink: #f4f5f7;
      --ink-muted: #9aa0ae;
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Inter", sans-serif;
      background: var(--bg);
      color: var(--ink);
      transition: background 0.25s ease, color 0.25s ease;
    }
    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 36px 24px 64px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }
    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .subtitle {
      margin: 6px 0 0;
      font-size: 14px;
      color: var(--ink-muted);
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .swatches {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 28px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      align-items: center;
    }
    .swatches-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-muted);
      margin-right: 6px;
    }
    .swatch {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      border: 2px solid transparent;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12);
      transition: transform 0.15s ease;
    }
    .swatch:hover { transform: scale(1.12); }
    .swatch.active {
      border-color: var(--accent);
      transform: scale(1.14);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
    }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 650;
    }
    .card-id {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      color: var(--ink-muted);
      background: var(--surface-soft);
      padding: 2px 8px;
      border-radius: 999px;
    }
    .badge-new {
      font-size: 11px;
      font-weight: 600;
      color: #ffffff;
      background: var(--new-badge);
      padding: 2px 8px;
      border-radius: 999px;
    }
    .stage {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 16px;
      padding: 16px 8px;
      border-radius: 16px;
      background: var(--surface-soft);
    }
    .caption {
      font-size: 13px;
      color: var(--ink-muted);
      line-height: 1.45;
    }
    .sizes-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--ink-muted);
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .mini-strip {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1, 1); }
      50% { transform: scale(1.015, 0.992); }
    }
    .hero-svg {
      animation: breathe 4.2s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Luna Bot 全端共用 Bot 资产库（18 套风格）</h1>
        <p class="subtitle">同步支持 Android Compose Canvas 与 Desktop/Web SVG · 统一 15 色陶瓷调色板与光学尺寸规范</p>
      </div>
      <div class="controls">
        <button class="btn" id="themeBtn">切换深色 / 浅色背景</button>
      </div>
    </header>

    <div class="swatches" id="swatches">
      <span class="swatches-label">15 色陶瓷调色板：</span>
    </div>

    <div class="grid" id="grid"></div>
  </div>

  <script>
    const FACES = {
      white:  { light: "#FFFFFF", body: "#F5F2EC", edge: "#DCD6CC", eye: "#1C1C1E", warm: true },
      black:  { light: "#373A40", body: "#191B1F", edge: "#0A0B0D", eye: "#F8FAFC" },
      silver: { light: "#EEF1F6", body: "#D5DCE6", edge: "#B4BECA", eye: "#1C1E24" },
      grey:   { light: "#C7CCD4", body: "#9FA6B2", edge: "#7E8591", eye: "#181A1F" },
      blue:   { light: "#DCEBFF", body: "#B6D4FA", edge: "#8CB6EC", eye: "#182233" },
      cyan:   { light: "#D6F5FA", body: "#A5E3EE", edge: "#7AC8D8", eye: "#13262B" },
      teal:   { light: "#D3F3EE", body: "#9EDCD2", edge: "#74BFB4", eye: "#132624" },
      green:  { light: "#D8F2E2", body: "#A8DFBE", edge: "#7DC49B", eye: "#16291E" },
      mint:   { light: "#DFF7EB", body: "#B3E8CE", edge: "#89CFAF", eye: "#162920" },
      yellow: { light: "#FFF4D1", body: "#F7DF94", edge: "#E2C063", eye: "#2B2313", warm: true },
      orange: { light: "#FFE7D4", body: "#F7C49B", edge: "#E19E6E", eye: "#2E1E14", warm: true },
      coral:  { light: "#FFE0DA", body: "#F6B7AC", edge: "#DE8F82", eye: "#2E1917", warm: true },
      red:    { light: "#FDE0E0", body: "#F2B5B7", edge: "#D98C91", eye: "#2D1719", warm: true },
      pink:   { light: "#FCE2F0", body: "#F2BEDB", edge: "#DA98BE", eye: "#2B1824", warm: true },
      purple: { light: "#ECE3FF", body: "#CFC0F8", edge: "#AC98E5", eye: "#201833" },
    };

    const STYLES = [
      { id: "orb",     name: "琉璃月灵", en: "Orb",      caption: "温润琉璃球 · 柔和顶光与自适应腮红", isNew: false },
      { id: "neko",    name: "折耳瓷猫", en: "Neko",     caption: "哑光白瓷猫耳 · 微动耳尖与小鼻", isNew: false },
      { id: "liquid",  name: "极光液滴", en: "Liquid",   caption: "半透蛋白石 · 虹彩折射光带", isNew: false },
      { id: "synth",   name: "复古掌机", en: "Synth",    caption: "工业小方块 · 曜石屏与珊瑚旋钮", isNew: false },
      { id: "spirit",  name: "星月软团", en: "Spirit",   caption: "软萌有机软团 · 悬浮鎏金弯月", isNew: false },
      { id: "minibot", name: "陶瓷微机", en: "Mini-bot", caption: "磨砂微机 · 发光面罩与光环", isNew: false },
      { id: "bunny",   name: "垂耳瓷兔", en: "Bunny",    caption: "雕塑长兔耳 · 推导色内耳与瓷面腮红", isNew: true },
      { id: "astro",   name: "宇航头盔", en: "Astro",    caption: "太空陶瓷圆头盔 · 全景穹顶曜石面罩", isNew: true },
      { id: "prism",   name: "切面晶石", en: "Prism",    caption: "柔角八面晶石 · 多层几何折射切面", isNew: true },
      { id: "bear",    name: "绒雾小熊", en: "Bear",     caption: "对称圆润熊耳 · 浅色陶瓷吻部与小鼻", isNew: true },
      { id: "retro",   name: "像素终端", en: "Retro",    caption: "复古一体机 · 荧光暗屏与翡翠状态灯", isNew: true },
      { id: "fox",     name: "灵耳瓷狐", en: "Fox",      caption: "尖耳白瓷狐 · 柔光面颊与小鼻", isNew: true },
      { id: "frog",    name: "抹茶瓷蛙", en: "Frog",     caption: "圆鼓双眸 · 治愈系陶瓷", isNew: true },
      { id: "owl",     name: "夜羽瓷枭", en: "Owl",      caption: "羽簇耳角 · 心形面盘与鎏金小喙", isNew: true },
      { id: "ghost",   name: "浮云幽灵", en: "Ghost",    caption: "温润半透 · 三浪漂浮裙摆", isNew: true },
      { id: "camera",  name: "徕卡微机", en: "Camera",   caption: "极简旁轴 · 珊瑚快门与光学镜头", isNew: true },
      { id: "cloud",   name: "软绵云朵", en: "Cloud",    caption: "蓬松五瓣浮云 · 柔光腮红", isNew: true },
      { id: "classic", name: "经典极简", en: "Classic",  caption: "原始极简圆球 · 经典 -19.1° 倾斜眼", isNew: false },
    ];

    const hexRgb = (hex) => {
      const v = parseInt(hex.slice(1), 16);
      return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
    };
    const mixHex = (from, to, amt) => {
      const a = hexRgb(from), b = hexRgb(to);
      return "#" + [0, 1, 2].map(i => Math.round(a[i] + (b[i] - a[i]) * amt).toString(16).padStart(2, "0")).join("");
    };
    const isLightBody = (body) => {
      const [r, g, b] = hexRgb(body);
      return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.55;
    };

    function eyeSpecFor(style) {
      if (style === "classic") {
        const tilt = (-19.1 * Math.PI) / 180;
        const c = Math.cos(tilt), s = Math.sin(tilt);
        const vis = (side) => ({ x: side * 0.342 * 50 * c, y: -0.15 * 50 + side * 0.342 * 50 * s });
        return { left: vis(-1), right: vis(1), w: 12.5, h: 24.5, rot: -16.7, visor: false };
      }
      if (["synth", "minibot", "astro", "retro", "camera"].includes(style)) {
        const y = style === "retro" ? -9 : style === "synth" ? -5 : style === "astro" ? -2 : style === "camera" ? 5 : -1.5;
        const x = style === "camera" ? 9.5 : style === "astro" ? 13 : 12.5;
        return { left: { x: -x, y }, right: { x, y }, w: style === "camera" ? 8.2 : style === "astro" ? 9.4 : 9.2, h: style === "camera" ? 14.5 : style === "retro" ? 15.5 : style === "astro" ? 16.5 : 16, rot: 0, visor: true };
      }
      if (style === "frog")  return { left: { x: -21, y: -18 }, right: { x: 21, y: -18 }, w: 10.6, h: 13, rot: 0, visor: false };
      if (style === "fox" || style === "cloud") return { left: { x: -13.5, y: 4 }, right: { x: 13.5, y: 4 }, w: 10.2, h: 17.5, rot: 0, visor: false };
      if (style === "owl")   return { left: { x: -14, y: -2 }, right: { x: 14, y: -2 }, w: 10.4, h: 17.5, rot: 0, visor: false };
      if (style === "ghost") return { left: { x: -12.5, y: -4 }, right: { x: 12.5, y: -4 }, w: 10.2, h: 17.5, rot: 0, visor: false };
      if (style === "bunny") return { left: { x: -13.5, y: 5 }, right: { x: 13.5, y: 5 }, w: 10.2, h: 17.5, rot: 0, visor: false };
      if (style === "bear")  return { left: { x: -14.5, y: -3 }, right: { x: 14.5, y: -3 }, w: 10.2, h: 17, rot: 0, visor: false };
      if (style === "prism") return { left: { x: -13.5, y: 0 }, right: { x: 13.5, y: 0 }, w: 10.4, h: 18, rot: 0, visor: false };
      return { left: { x: -14.5, y: style === "neko" ? 2 : -1 }, right: { x: 14.5, y: style === "neko" ? 2 : -1 }, w: 10.6, h: 18.5, rot: 0, visor: false };
    }

    let uid = 0;
    function renderFaceSVG(style, colorKey, size, hero = false) {
      const id = `f${++uid}`;
      const face = FACES[colorKey];
      const light = isLightBody(face.body);
      const rim = light ? "rgba(24,24,28,0.14)" : "rgba(255,255,255,0.22)";
      const innerEar = face.warm ? mixHex(face.edge, "#F497AE", 0.45) : mixHex(face.edge, "#FFFFFF", 0.52);
      const spec = eyeSpecFor(style);
      const eyeFill = spec.visor ? (style === "retro" ? "#E6FFF5" : "#F5F9FF") : face.eye;
      const g = `g-${id}`, op = `op-${id}`, sp = `sp-${id}`, bn = `bn-${id}`, bl = `bl-${id}`, cp = `cp-${id}`;
      const blushColor = face.warm ? "#EB8B9E" : (light ? "#D495B8" : mixHex(face.light, "#FFFFFF", 0.45));
      const blushO1 = face.warm ? (light ? 0.22 : 0.16) : (light ? 0.18 : 0.14);
      const blushO2 = face.warm ? (light ? 0.08 : 0.05) : (light ? 0.06 : 0.04);

      let bodySvg = "";
      switch (style) {
        case "orb":
          bodySvg = `
            <circle cx="50" cy="50" r="45" fill="url(#${g})" />
            <g clip-path="url(#${cp})">
              <circle cx="50" cy="50" r="45" fill="url(#${bn})" />
              <ellipse cx="36" cy="28" rx="23" ry="16" transform="rotate(-22 36 28)" fill="url(#${sp})" />
              <circle cx="26" cy="57" r="12.5" fill="url(#${bl})" />
              <circle cx="74" cy="57" r="12.5" fill="url(#${bl})" />
            </g>
            <circle cx="50" cy="50" r="45" fill="none" stroke="${rim}" stroke-width="1.5" />`;
          break;
        case "neko":
          bodySvg = `
            <path d="M19 37 L15 13 C14.5 9 19 7.5 22 10 L40 24 Z" fill="url(#${g})" stroke="${rim}" stroke-width="1.2" stroke-linejoin="round" />
            <path d="M81 37 L85 13 C85.5 9 81 7.5 78 10 L60 24 Z" fill="url(#${g})" stroke="${rim}" stroke-width="1.2" stroke-linejoin="round" />
            <path d="M22 31 L19.5 17 L33 25 Z" fill="${innerEar}" opacity="${light ? 0.5 : 0.36}" />
            <path d="M78 31 L80.5 17 L67 25 Z" fill="${innerEar}" opacity="${light ? 0.5 : 0.36}" />
            <ellipse cx="50" cy="55" rx="43" ry="39" fill="url(#${g})" stroke="${rim}" stroke-width="1.4" />
            <ellipse cx="36" cy="34" rx="19" ry="11" transform="rotate(-14 36 34)" fill="url(#${sp})" />
            <path d="M47 61 Q50 64 53 61 Q50 59.5 47 61 Z" fill="${face.eye}" opacity="0.72" />
            <circle cx="27" cy="60" r="11.5" fill="url(#${bl})" />
            <circle cx="73" cy="60" r="11.5" fill="url(#${bl})" />`;
          break;
        case "liquid":
          bodySvg = `
            <circle cx="50" cy="50" r="45" fill="url(#${op})" stroke="rgba(255,255,255,0.42)" stroke-width="1.6" />
            <circle cx="50" cy="50" r="41" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1" />
            <path d="M22 35 C30 19, 54 15, 70 24" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="4.2" stroke-linecap="round" />
            <path d="M30 76 C44 83, 64 79, 76 66" fill="none" stroke="${mixHex(face.light, "#FFFFFF", 0.6)}" stroke-width="3.2" stroke-linecap="round" opacity="0.48" />`;
          break;
        case "synth":
          bodySvg = `
            <rect x="8" y="9" width="84" height="82" rx="20" fill="url(#${g})" stroke="${rim}" stroke-width="1.6" />
            <circle cx="78" cy="20" r="4" fill="#FF5A36" stroke="rgba(0,0,0,0.25)" stroke-width="0.9" />
            <rect x="18" y="27" width="64" height="36" rx="11" fill="#101216" stroke="rgba(255,255,255,0.16)" stroke-width="1.2" />
            <rect x="21" y="30" width="58" height="11" rx="5.5" fill="rgba(255,255,255,0.06)" />
            ${[33, 41.5, 50, 58.5, 67].map(cx => `<circle cx="${cx}" cy="75" r="2" fill="${light ? "rgba(28,28,30,0.28)" : "rgba(255,255,255,0.32)"}" />`).join("")}`;
          break;
        case "spirit":
          bodySvg = `
            <path d="M22 22 C18 10, 29 6, 36 16 C43 13, 57 13, 64 16 C71 6, 82 10, 78 22 C91 32, 95 48, 92 66 C89 85, 72 95, 50 95 C28 95, 11 85, 8 66 C5 48, 9 32, 22 22 Z" fill="url(#${g})" stroke="${rim}" stroke-width="1.4" />
            <ellipse cx="36" cy="30" rx="20" ry="12" transform="rotate(-12 36 30)" fill="url(#${sp})" />
            <circle cx="24" cy="59" r="13" fill="url(#${bl})" />
            <circle cx="76" cy="59" r="13" fill="url(#${bl})" />
            <path d="M87 6 A7.5 7.5 0 1 0 95 16 A5.8 5.8 0 1 1 87 6 Z" fill="#E8C77B" stroke="#B68E35" stroke-width="0.6" />`;
          break;
        case "minibot":
          bodySvg = `
            <ellipse cx="50" cy="10" rx="21" ry="4.2" fill="none" stroke="#E2B95F" stroke-width="3" />
            <ellipse cx="50" cy="9.3" rx="20" ry="3.5" fill="none" stroke="#F8E1A0" stroke-width="1" opacity="0.85" />
            <rect x="8" y="17" width="84" height="75" rx="25" fill="url(#${g})" stroke="${rim}" stroke-width="1.5" />
            <rect x="3" y="44" width="6" height="22" rx="3" fill="${face.edge}" />
            <rect x="91" y="44" width="6" height="22" rx="3" fill="${face.edge}" />
            <rect x="18" y="30" width="64" height="38" rx="15" fill="#0F1117" stroke="rgba(255,255,255,0.18)" stroke-width="1.2" />
            <path d="M26 36 Q50 32 74 36" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="2.4" stroke-linecap="round" />`;
          break;
        case "bunny":
          bodySvg = `
            <ellipse cx="32" cy="25" rx="10" ry="20" transform="rotate(-11 32 25)" fill="url(#${g})" stroke="${rim}" stroke-width="1.2" />
            <ellipse cx="68" cy="25" rx="10" ry="20" transform="rotate(11 68 25)" fill="url(#${g})" stroke="${rim}" stroke-width="1.2" />
            <ellipse cx="32" cy="26" rx="5" ry="13" transform="rotate(-11 32 26)" fill="${innerEar}" opacity="${light ? 0.5 : 0.36}" />
            <ellipse cx="68" cy="26" rx="5" ry="13" transform="rotate(11 68 26)" fill="${innerEar}" opacity="${light ? 0.5 : 0.36}" />
            <ellipse cx="50" cy="59" rx="40" ry="35" fill="url(#${g})" stroke="${rim}" stroke-width="1.4" />
            <ellipse cx="37" cy="40" rx="18" ry="10" transform="rotate(-14 37 40)" fill="url(#${sp})" />
            <ellipse cx="50" cy="64.5" rx="3.4" ry="2.2" fill="${face.eye}" opacity="0.68" />
            <circle cx="26" cy="64" r="11" fill="url(#${bl})" />
            <circle cx="74" cy="64" r="11" fill="url(#${bl})" />`;
          break;
        case "astro":
          bodySvg = `
            <rect x="3" y="42" width="7" height="20" rx="3.5" fill="${face.edge}" stroke="${rim}" stroke-width="0.8" />
            <rect x="90" y="42" width="7" height="20" rx="3.5" fill="${face.edge}" stroke="${rim}" stroke-width="0.8" />
            <circle cx="50" cy="50" r="44" fill="url(#${g})" stroke="${rim}" stroke-width="1.5" />
            <ellipse cx="38" cy="20" rx="18" ry="8" transform="rotate(-14 38 20)" fill="url(#${sp})" />
            <rect x="16" y="25" width="68" height="44" rx="22" fill="#0E1118" stroke="rgba(255,255,255,0.22)" stroke-width="1.3" />
            <path d="M27 33 Q46 27 68 32" fill="none" stroke="rgba(255,255,255,0.24)" stroke-width="3" stroke-linecap="round" />
            <rect x="42" y="77" width="16" height="3.6" rx="1.8" fill="${light ? "rgba(24,24,28,0.22)" : "rgba(255,255,255,0.26)"}" />`;
          break;
        case "prism":
          bodySvg = `
            <path d="M34 8 L66 8 Q73 8 78 13 L87 22 Q92 27 92 34 L92 66 Q92 73 87 78 L78 87 Q73 92 66 92 L34 92 Q27 92 22 87 L13 78 Q8 73 8 66 L8 34 Q8 27 13 22 L22 13 Q27 8 34 8 Z" fill="url(#${g})" stroke="${rim}" stroke-width="1.5" />
            <path d="M22 13 L66 8 L50 32 L13 54 L8 34 Q8 27 13 22 Z" fill="#FFFFFF" opacity="${light ? 0.3 : 0.15}" />
            <path d="M92 48 L92 66 Q92 73 87 78 L78 87 Q73 92 66 92 L46 92 L64 68 Z" fill="${face.edge}" opacity="${light ? 0.28 : 0.34}" />
            <path d="M18 68 L68 18 L79 26 L29 76 Z" fill="#FFFFFF" opacity="${light ? 0.16 : 0.09}" />
            <path d="M35.5 12 L64.5 12 Q70 12 74 16 L84 26 Q88 30 88 35.5 L88 64.5 Q88 70 84 74 L74 84 Q70 88 64.5 88 L35.5 88 Q30 88 26 84 L16 74 Q12 70 12 64.5 L12 35.5 Q12 30 16 26 L26 16 Q30 12 35.5 12 Z" fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="1.1" />`;
          break;
        case "bear":
          bodySvg = `
            <circle cx="22" cy="23" r="15.5" fill="url(#${g})" stroke="${rim}" stroke-width="1.3" />
            <circle cx="78" cy="23" r="15.5" fill="url(#${g})" stroke="${rim}" stroke-width="1.3" />
            <circle cx="22" cy="23" r="8.2" fill="${innerEar}" opacity="${light ? 0.52 : 0.36}" />
            <circle cx="78" cy="23" r="8.2" fill="${innerEar}" opacity="${light ? 0.52 : 0.36}" />
            <ellipse cx="50" cy="54" rx="43" ry="39.5" fill="url(#${g})" stroke="${rim}" stroke-width="1.4" />
            <ellipse cx="36" cy="31" rx="19" ry="10.5" transform="rotate(-14 36 31)" fill="url(#${sp})" />
            <ellipse cx="50" cy="64" rx="16.5" ry="11.5" fill="${mixHex(face.light, "#FFFFFF", 0.55)}" opacity="${light ? 0.72 : 0.22}" />
            <path d="M45.5 60.5 Q50 58.8 54.5 60.5 Q52.5 65.5 50 65.5 Q47.5 65.5 45.5 60.5 Z" fill="${face.eye}" opacity="0.82" />
            <circle cx="25" cy="61" r="11.5" fill="url(#${bl})" />
            <circle cx="75" cy="61" r="11.5" fill="url(#${bl})" />`;
          break;
        case "retro":
          bodySvg = `
            <rect x="9" y="8" width="82" height="84" rx="17" fill="url(#${g})" stroke="${rim}" stroke-width="1.6" />
            <path d="M22 13 H78" stroke="rgba(255,255,255,0.45)" stroke-width="2" stroke-linecap="round" opacity="${light ? 0.7 : 0.28}" />
            <rect x="18" y="18" width="64" height="46" rx="10" fill="#121A17" stroke="rgba(255,255,255,0.18)" stroke-width="1.2" />
            <path d="M24 23 Q50 19.5 76 23" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2.2" stroke-linecap="round" />
            <rect x="22" y="74.5" width="28" height="4.2" rx="2.1" fill="${light ? "rgba(24,24,28,0.24)" : "rgba(255,255,255,0.28)"}" />
            <circle cx="74" cy="76.6" r="3.4" fill="#34D399" stroke="rgba(0,0,0,0.2)" stroke-width="0.8" />`;
          break;
        case "fox":
          bodySvg = `
            <path d="M20 44 L13 10 C12.5 7 17 6 20 8.5 L42 26 Z" fill="url(#${g})" stroke="${rim}" stroke-width="1.2" stroke-linejoin="round" />
            <path d="M80 44 L87 10 C87.5 7 83 6 80 8.5 L58 26 Z" fill="url(#${g})" stroke="${rim}" stroke-width="1.2" stroke-linejoin="round" />
            <path d="M22 36 L17.5 14.5 L35 26 Z" fill="${innerEar}" opacity="${light ? 0.52 : 0.36}" />
            <path d="M78 36 L82.5 14.5 L65 26 Z" fill="${innerEar}" opacity="${light ? 0.52 : 0.36}" />
            <path d="M14 54 C14 34, 30 24, 50 24 C70 24, 86 34, 86 54 C86 63, 93 66, 86 73 C77 82, 62 91, 50 91 C38 91, 23 82, 14 73 C7 66, 14 63, 14 54 Z" fill="url(#${g})" stroke="${rim}" stroke-width="1.4" />
            <ellipse cx="37" cy="38" rx="17" ry="9.5" transform="rotate(-14 37 38)" fill="url(#${sp})" />
            <path d="M16 69 Q30 62 46 72 Q32 84 16 69 Z" fill="${mixHex(face.light, "#FFFFFF", 0.55)}" opacity="${light ? 0.55 : 0.16}" />
            <path d="M84 69 Q70 62 54 72 Q68 84 84 69 Z" fill="${mixHex(face.light, "#FFFFFF", 0.55)}" opacity="${light ? 0.55 : 0.16}" />
            <path d="M46 65 Q50 63.5 54 65 Q52 69 50 69 Q48 69 46 65 Z" fill="${face.eye}" opacity="0.82" />
            <circle cx="27" cy="63" r="10.5" fill="url(#${bl})" />
            <circle cx="73" cy="63" r="10.5" fill="url(#${bl})" />`;
          break;
        case "frog":
          bodySvg = `
            <circle cx="29" cy="32" r="16.5" fill="url(#${g})" stroke="${rim}" stroke-width="1.3" />
            <circle cx="71" cy="32" r="16.5" fill="url(#${g})" stroke="${rim}" stroke-width="1.3" />
            <ellipse cx="50" cy="59" rx="43" ry="33" fill="url(#${g})" stroke="${rim}" stroke-width="1.4" />
            <circle cx="29" cy="33" r="15" fill="url(#${g})" />
            <circle cx="71" cy="33" r="15" fill="url(#${g})" />
            <ellipse cx="48" cy="42" rx="20" ry="9" fill="url(#${sp})" />
            <circle cx="24" cy="61" r="11.5" fill="url(#${bl})" />
            <circle cx="76" cy="61" r="11.5" fill="url(#${bl})" />`;
          break;
        case "owl":
          bodySvg = `
            <path d="M21 30 L15 11 C15 8.5 19.5 8 22.5 11 L35 21 Z" fill="url(#${g})" stroke="${rim}" stroke-width="1.2" stroke-linejoin="round" />
            <path d="M79 30 L85 11 C85 8.5 80.5 8 77.5 11 L65 21 Z" fill="url(#${g})" stroke="${rim}" stroke-width="1.2" stroke-linejoin="round" />
            <ellipse cx="50" cy="55" rx="41" ry="38" fill="url(#${g})" stroke="${rim}" stroke-width="1.4" />
            <path d="M50 38 C42 29, 21 32, 21 50 C21 67, 36 77, 50 80 C64 77, 79 67, 79 50 C79 32, 58 29, 50 38 Z" fill="${mixHex(face.light, "#FFFFFF", 0.55)}" opacity="${light ? 0.65 : 0.18}" />
            <ellipse cx="36" cy="32" rx="16" ry="9" transform="rotate(-14 36 32)" fill="url(#${sp})" />
            <path d="M50 53 L54.8 59.5 L50 65.5 L45.2 59.5 Z" fill="#DFB664" stroke="#A88233" stroke-width="0.8" stroke-linejoin="round" />`;
          break;
        case "ghost":
          bodySvg = `
            <path d="M16 46 C16 20, 31 10, 50 10 C69 10, 84 20, 84 46 L86 78 C86 87, 79 91, 73 86 C68 81, 63 81, 59 87 C55 92, 45 92, 41 87 C37 81, 32 81, 27 86 C21 91, 14 87, 14 78 Z" fill="url(#${g})" stroke="${rim}" stroke-width="1.4" />
            <ellipse cx="38" cy="27" rx="16" ry="10" transform="rotate(-18 38 27)" fill="url(#${sp})" />
            <circle cx="29" cy="55" r="10.5" fill="url(#${bl})" />
            <circle cx="71" cy="55" r="10.5" fill="url(#${bl})" />`;
          break;
        case "camera":
          bodySvg = `
            <rect x="17" y="15" width="13" height="6" rx="3" fill="#FF6B4A" stroke="rgba(0,0,0,0.18)" stroke-width="0.8" />
            <path d="M33 22 L37 13 Q39 10 43 10 L57 10 Q61 10 63 13 L67 22 Z" fill="url(#${g})" stroke="${rim}" stroke-width="1.3" stroke-linejoin="round" />
            <rect x="8" y="21" width="84" height="68" rx="16" fill="url(#${g})" stroke="${rim}" stroke-width="1.6" />
            <circle cx="50" cy="55" r="26.5" fill="${face.edge}" stroke="${rim}" stroke-width="1.1" />
            <circle cx="50" cy="55" r="23" fill="#0F1117" stroke="rgba(255,255,255,0.22)" stroke-width="1.2" />
            <path d="M36 44 Q48 35 62 41" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2.6" stroke-linecap="round" />`;
          break;
        case "cloud":
          bodySvg = `
            <path d="M25 81 C13 81, 6 72, 6 61 C6 51, 13 43, 22 41 C22 30, 31 22, 42 22 C45 14, 53 10, 62 12 C72 14, 79 22, 80 33 C89 35, 95 44, 95 54 C95 66, 86 76, 75 78 C71 84, 62 87, 52 87 C43 87, 35 84, 31 81 Z" fill="url(#${g})" stroke="${rim}" stroke-width="1.4" stroke-linejoin="round" />
            <ellipse cx="43" cy="30" rx="17" ry="9" transform="rotate(-12 43 30)" fill="url(#${sp})" />
            <circle cx="29" cy="60" r="11" fill="url(#${bl})" />
            <circle cx="71" cy="60" r="11" fill="url(#${bl})" />`;
          break;
        default:
          bodySvg = `<circle cx="50" cy="50" r="45" fill="url(#${g})" stroke="${rim}" stroke-width="1.2" />`;
      }

      const eyeSvg = (pt) => `<g transform="translate(${50 + pt.x} ${50 + pt.y}) rotate(${spec.rot})"><rect x="${-spec.w / 2}" y="${-spec.h / 2}" width="${spec.w}" height="${spec.h}" rx="${spec.w / 2}" fill="${eyeFill}" /></g>`;

      return `
        <svg width="${size}" height="${size}" viewBox="0 0 100 100" class="${hero ? "hero-svg" : ""}" style="display:block;overflow:visible">
          <defs>
            <radialGradient id="${g}" cx="32%" cy="22%" r="82%">
              <stop offset="0" stop-color="${face.light}" />
              <stop offset="0.55" stop-color="${face.body}" />
              <stop offset="1" stop-color="${face.edge}" />
            </radialGradient>
            <linearGradient id="${op}" x1="12%" y1="8%" x2="88%" y2="92%">
              <stop offset="0" stop-color="${mixHex(face.light, "#FFFFFF", 0.42)}" />
              <stop offset="0.42" stop-color="${face.body}" />
              <stop offset="0.75" stop-color="${mixHex(face.body, face.light, 0.35)}" />
              <stop offset="1" stop-color="${face.edge}" />
            </linearGradient>
            <radialGradient id="${sp}" cx="50%" cy="50%" r="50%">
              <stop offset="0" stop-color="#FFFFFF" stop-opacity="${light ? 0.72 : 0.42}" />
              <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="${light ? 0.22 : 0.11}" />
              <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
            </radialGradient>
            <radialGradient id="${bn}" cx="50%" cy="88%" r="52%">
              <stop offset="0" stop-color="${mixHex(face.light, "#FFFFFF", 0.55)}" stop-opacity="${light ? 0.26 : 0.16}" />
              <stop offset="1" stop-color="${mixHex(face.light, "#FFFFFF", 0.55)}" stop-opacity="0" />
            </radialGradient>
            <radialGradient id="${bl}" cx="50%" cy="50%" r="50%">
              <stop offset="0" stop-color="${blushColor}" stop-opacity="${blushO1}" />
              <stop offset="0.55" stop-color="${blushColor}" stop-opacity="${blushO2}" />
              <stop offset="1" stop-color="${blushColor}" stop-opacity="0" />
            </radialGradient>
            <clipPath id="${cp}"><circle cx="50" cy="50" r="45" /></clipPath>
          </defs>
          ${bodySvg}
          ${eyeSvg(spec.left)}
          ${eyeSvg(spec.right)}
        </svg>
      `;
    }

    let activeColor = "white";
    const swatchesEl = document.getElementById("swatches");
    const gridEl = document.getElementById("grid");

    Object.entries(FACES).forEach(([key, val]) => {
      const btn = document.createElement("button");
      btn.className = "swatch" + (key === activeColor ? " active" : "");
      btn.title = key;
      btn.style.background = `radial-gradient(circle at 30% 25%, ${val.light}, ${val.body} 60%, ${val.edge})`;
      btn.onclick = () => {
        activeColor = key;
        document.querySelectorAll(".swatch").forEach(el => el.classList.remove("active"));
        btn.classList.add("active");
        renderAll();
      };
      swatchesEl.appendChild(btn);
    });

    function renderAll() {
      gridEl.innerHTML = STYLES.map(s => `
        <div class="card">
          <div class="card-head">
            <div>
              <span class="card-title">${s.name}</span>
              <span class="card-id">${s.id}</span>
            </div>
            ${s.isNew ? '<span class="badge-new">NEW</span>' : ''}
          </div>
          <div class="stage">
            ${renderFaceSVG(s.id, "blue", 30)}
            ${renderFaceSVG(s.id, activeColor, 82, true)}
            ${renderFaceSVG(s.id, "orange", 30)}
          </div>
          <div class="caption">${s.caption}</div>
          <div class="sizes-row">
            <span>24px / 36px 缩略校验</span>
            <div class="mini-strip">
              ${renderFaceSVG(s.id, activeColor, 24)}
              ${renderFaceSVG(s.id, "black", 24)}
              ${renderFaceSVG(s.id, "pink", 24)}
            </div>
          </div>
        </div>
      `).join("");
    }

    document.getElementById("themeBtn").onclick = () => document.body.classList.toggle("dark");
    renderAll();
  </script>
</body>
</html>
