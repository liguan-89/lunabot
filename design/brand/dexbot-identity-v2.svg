-family="Avenir Next, Helvetica Neue, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#6E6E6A" text-anchor="start">PRIMARY  /  WHITE ON BLACK</text><text x="1100" y="826" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="15" font-weight="400" letter-spacing="0" fill="#8C8C88" text-anchor="start">The face is the mark.</text><text x="1100" y="850" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="15" font-weight="400" letter-spacing="0" fill="#8C8C88" text-anchor="start">The wordmark is the name.</text><text x="64" y="1010" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#6E6E6A" text-anchor="start">03  ·  WORDMARK</text><line x1="64" y1="1026" x2="1536" y2="1026" stroke="#DADAD4" stroke-width="1"/><text x="64" y="1064" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#6E6E6A" text-anchor="start">A  /  plain</text><text x="808" y="1064" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#6E6E6A" text-anchor="start">B  /  the O is the bot</text><rect x="64" y="1082" width="700" height="190" rx="24" fill="#000"/><text x="104" y="1192" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="80" font-weight="800" letter-spacing="1.5" fill="#F7F3ED" text-anchor="start">DEX BOT</text><rect x="808" y="1082" width="728" height="190" rx="24" fill="#000"/><text x="848" y="1192" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="80" font-weight="800" letter-spacing="1.5" fill="#F7F3ED" text-anchor="start">DEX B</text><circle cx="1128.952" cy="1163.600" r="31.200" fill="#F7F3ED"/><g transform="rotate(-16.700 1118.869 1162.412)"><rect x="1114.969" y="1154.768" width="7.800" height="15.288" rx="3.900" fill="#1C1C1E"/></g><g transform="rotate(-16.700 1139.035 1155.428)"><rect x="1135.135" y="1147.784" width="7.800" height="15.288" rx="3.900" fill="#1C1C1E"/></g><text x="1163.752" y="1192" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="80" font-weight="800" letter-spacing="1.5" fill="#F7F3ED" text-anchor="start">T</text><text x="64" y="1310" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="15" font-weight="400" letter-spacing="0" fill="#6E6E6A" text-anchor="start">Two eyes only. No mouth: the face carries attention, not expression.</text><rect x="0" y="1348" width="1600" height="172" fill="#000"/><text x="64" y="1388" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#8C8C88" text-anchor="start">04  ·  FACE  /  ATTENTION, NOT EXPRESSION</text><circle cx="160.000" cy="1440.000" r="42.000" fill="url(#cream)"/><g transform="rotate(-16.700 146.427 1438.400)"><rect x="141.177" y="1428.110" width="10.500" height="20.580" rx="5.250" fill="#1C1C1E"/></g><g transform="rotate(-16.700 173.573 1429.000)"><rect x="168.323" y="1418.710" width="10.500" height="20.580" rx="5.250" fill="#1C1C1E"/></g><text x="160" y="1506" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#8C8C88" text-anchor="middle">idle</text><circle cx="416.000" cy="1440.000" r="42.000" fill="url(#cream)"/><g transform="rotate(-16.700 402.427 1438.400)"><rect x="397.177" y="1436.615" width="10.500" height="3.570" rx="5.250" fill="#1C1C1E"/></g><g transform="rotate(-16.700 429.573 1429.000)"><rect x="424.323" y="1427.215" width="10.500" height="3.570" rx="5.250" fill="#1C1C1E"/></g><text x="416" y="1506" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#8C8C88" text-anchor="middle">blink</text><circle cx="672.000" cy="1440.000" r="42.000" fill="url(#cream)"/><g transform="rotate(-16.700 658.427 1438.400)"><rect x="653.177" y="1436.615" width="10.500" height="3.570" rx="5.250" fill="#1C1C1E"/></g><g transform="rotate(