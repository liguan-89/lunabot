</defs><rect width="1600" height="1520" fill="#F4F4F2"/><text x="64" y="70" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#6E6E6A" text-anchor="start">DEX BOT  /  IDENTITY 02</text><text x="64" y="146" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="58" font-weight="800" letter-spacing="-1" fill="#0A0A0A" text-anchor="start">One circle. Two eyes.</text><text x="64" y="188" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="18" font-weight="400" letter-spacing="0" fill="#6E6E6A" text-anchor="start">The app’s own bot face: a flat disc, two tilted pills, no mouth. White on black, and nothing else.</text><text x="1536" y="70" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="14" font-weight="500" letter-spacing="2" fill="#6E6E6A" text-anchor="end">2026  ·  v2</text><text x="64" y="252" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#6E6E6A" text-anchor="start">01  ·  ICON</text><line x1="64" y1="268" x2="1536" y2="268" stroke="#DADAD4" stroke-width="1"/><g transform="translate(64 296) scale(0.224609375)"><defs><clipPath id="clip-tight"><rect width="1024" height="1024" rx="224"/></clipPath></defs><rect width="1024" height="1024" rx="224" fill="#000"/><g clip-path="url(#clip-tight)"><circle cx="650.000" cy="650.000" r="560.000" fill="url(#cream)"/><g transform="rotate(-16.700 469.023 628.669)"><rect x="399.023" y="491.469" width="140.000" height="274.400" rx="70.000" fill="#1C1C1E"/></g><g transform="rotate(-16.700 830.977 503.331)"><rect x="760.977" y="366.131" width="140.000" height="274.400" rx="70.000" fill="#1C1C1E"/></g></g></g><text x="64" y="556" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="15" font-weight="700" letter-spacing="1" fill="#0A0A0A" text-anchor="start">A · TIGHT</text><text x="64" y="578" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#6E6E6A" text-anchor="start">chosen · more left margin</text><g transform="translate(318 296) scale(0.224609375)"><defs><clipPath id="clip-mid"><rect width="1024" height="1024" rx="224"/></clipPath></defs><rect width="1024" height="1024" rx="224" fill="#000"/><g clip-path="url(#clip-mid)"><circle cx="560.000" cy="600.000" r="500.000" fill="url(#cream)"/><g transform="rotate(-16.700 398.414 580.954)"><rect x="335.914" y="458.454" width="125.000" height="245.000" rx="62.500" fill="#1C1C1E"/></g><g transform="rotate(-16.700 721.586 469.046)"><rect x="659.086" y="346.546" width="125.000" height="245.000" rx="62.500" fill="#1C1C1E"/></g></g></g><text x="318" y="556" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="15" font-weight="700" letter-spacing="1" fill="#0A0A0A" text-anchor="start">B · BALANCED</text><text x="318" y="578" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#6E6E6A" text-anchor="start">more of the face</text><g transform="translate(572 296) scale(0.224609375)"><defs><clipPath id="clip-full"><rect width="1024" height="1024" rx="224"/></clipPath></defs><rect width="1024" height="1024" rx="224" fill="#000"/><g clip-path="url(#clip-full)"><circle cx="512.000" cy="512.000" r="400.000" fill="url(#cream)"/><g transform="rotate(-16.700 382.731 496.763)"><rect x="332.731" y="398.763" width="100.000" height="196.000" rx="50.000" fill="#1C1C1E"/></g><g transform="rotate(-16.700 641.269 407.237)"><rect x="591.269" y="309.237" width="100.000" height="196.000" rx="50.000" fill="#1C1C1E"/></g></g></g><text x="572" y="556" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="15" font-weight="700" letter-spacing="1" fill="#0A0A0A" text-anchor="start">C · FULL MARK</text><text x="572" y="578" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#6E6E6A" text-anchor="start">no crop, clearest</text><g transform="translate(920 296) scale(0.2734375)"><defs><clipPath id="clip-hero"><rect width="1024" height="1024" rx="224"/></clipPath></defs><rect width="1024" height="1024" rx="224" fill="#000"/><g clip-path="url(#clip-hero)"><circle cx="650.000" cy="650.000" r="560.000" fill="url(#cream)"/><g transform="rotate(-16.700 469.023 628.669)"><rect x="399.023" y="491.469" width="140.000" height="274.400" rx="70.000" fill="#1C1C1E"/></g><g transform="rotate(-16.700 830.977 503.331)"><rect x="760.977" y="366.131" width="140.000" height="274.400" rx="70.000" fill="#1C1C1E"/></g></g></g><text x="1232" y="338" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5" fill="#0A0A0A" text-anchor="start">The bot is the icon.</text><text x="1232" y="372" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="15" font-weight="400" letter-spacing="0" fill="#6E6E6A" text-anchor="start">White face, black frame.</text><text x="1232" y="394" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="15" font-weight="400" letter-spacing="0" fill="#6E6E6A" text-anchor="start">One shape, no second colour.</text><text x="1232" y="440" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#6E6E6A" text-anchor="start">48 / 32 / 16 px</text><g transform="translate(1232 456) scale(0.046875)"><defs><clipPath id="clip-16"><rect width="1024" height="1024" rx="224"/></clipPath></defs><rect width="1024" height="1024" rx="224" fill="#000"/><g clip-path="url(#clip-16)"><circle cx="650.000" cy="650.000" r="560.000" fill="url(#cream)"/><g transform="rotate(-16.700 469.023 628.669)"><rect x="399.023" y="491.469" width="140.000" height="274.400" rx="70.000" fill="#1C1C1E"/></g><g transform="rotate(-16.700 830.977 503.331)"><rect x="760.977" y="366.131" width="140.000" height="274.400" rx="70.000" fill="#1C1C1E"/></g></g></g><g transform="translate(1292 456) scale